# The P7 3D Look-Locker acceptance case (P7 plan, Task 16) on the crop: PASL (Q2TIPS, 0.7 s), cycles of
# 6 readouts 0.3 s apart from 0.8 s, each a sub-train of the 3D EPI train (8 degrees, 40 ms between
# excitations), two shots per group, TR 4.0 s, the label entering the slab 0.3 s after labeling.
seed = 89

[acquisition]
oversample = 2
signal_scale = 100.0
noise_variance = 0.01

[signal]
acq_contrast = "ge"

[readout]
excitation_spacing = 40.0
slab_entry_time = 0.3

[look_locker]
readouts_per_cycle = 6

[m0]
repetition_time = 6.0
