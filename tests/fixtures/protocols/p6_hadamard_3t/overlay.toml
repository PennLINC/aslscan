# p6_hadamard on the 3 T phantom cropped to 97 mm in z (work/phantom-3t-z97, 24 slices of 4.05 mm),
# 3.5 mm in plane, slices 35 ms apart, TR 4.5 s.
# H8 PCASL: seven sub-boli of 0.25 s, PLD 1.5 s (each row's PostLabelingDelay is its sub-bolus's
# effective delay), two encoding cycles, an m0scan row before the first; exchange on.
seed = 72

[acquisition]
oversample = 2
noise_variance = 0.01

[kinetic]
exchange_time = 0.5

[hadamard]
order = 8
