# The P7 Look-Locker Hadamard acceptance case (P7 plan, Task 8) on the crop: H8 PCASL, seven
# sub-boli of 0.25 s, each encoded preparation read at PLD_n = 0.5, 0.8, 1.1, 1.4 s (35 degrees), TR
# 4.5 s, two encoding cycles after an included M0; exchange on.
seed = 87

[acquisition]
oversample = 2
signal_scale = 100.0
noise_variance = 0.01

[signal]
acq_contrast = "ge"

[kinetic]
exchange_time = 0.5

[hadamard]
order = 8

[look_locker]
readouts_per_cycle = 4
